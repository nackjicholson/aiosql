#
# GitHub CI
#
# Testing AioSQL is not easy because of the number of databases and drivers envolve.
# In particular, installing mariadb and mysql drivers together does not always work.
# There is a working set of docker compose stuff to reach 100% coverage under "docker/".
# This runs a subset within a single image.
#

name: Aiosql Package

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/python-versions (versions-manifest.json)
        # https://downloads.python.org/pypy/versions.json
        # 3.14 KO on pydantic build dependences 2024-10-27
        # 3.14 way too slow duckdb wheel build 2025-01-28
        # 3.1[34]t way too slow duckdb wheel build 2026-01-04
        # 3.13t KO on ast-serialize dependences (maturin/cargo) 2026-11-09
        # pypy3.11 much too slow 2026-11-14
        # failunder: asyncpg, duckdb and mysql skips lower expectations
        python:
        - version: "3.11"
          nomysql: 1
          failunder: 99.2
        - version: "3.12"
          nomysql: 1
          failunder: 99.2
        - version: "3.13"
          nomysql: 1
          failunder: 99.2
        - version: "3.14"
          nomysql: 1
          failunder: 99.2
        - version: "3.14t"
          gil: 1
          noduckdb: 1
          failunder: 95.1
        - version: "3.14t"
          gil: 0
          noduckdb: 1
          failunder: 95.1
        - version: "3.15"
          failunder: 99.7
        - version: "3.15t"
          gil: 1
          noduckdb: 1
          failunder: 95.1
        - version: "3.15t"
          gil: 0
          noduckdb: 1
          failunder: 95.1
    env:
      PYTHON_GIL: ${{ matrix.python.gil }}
      # TODO skip these intermediate env vars
      NO_DUCKDB: ${{ matrix.python.noduckdb }}
      NO_MYSQL: ${{ matrix.python.nomysql }}
      FAIL_UNDER: ${{ matrix.python.failunder }}
    steps:
    - name: Checkout Project
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}
        allow-prereleases: true
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[dev,dev-postgres,dev-sqlite]
        [ "$NO_MYSQL" ] || python -m pip install .[dev-mysql]
        [ "$NO_DUCKDB" ] || python -m pip install .[dev-duckdb]
    # - name: Check types with mypy
    #   run: make VENV= INSTALL= check.mypy
    - name: Check types with pyright
      run: make VENV= INSTALL= check.pyright
    - name: Lint with ruff
      run: make VENV= INSTALL= check.ruff
    - name: Test with pytest and databases
      run: |
        [ "$NO_MYSQL" ] && MYSQL=skip || MYSQL=mysql
        make VENV= INSTALL= MYSQL=$MYSQL check.pytest
    - name: Coverage tests
      run: |
        [ "$NO_MYSQL" ] && MYSQL=skip || MYSQL=mysql
        make VENV= INSTALL= MYSQL=$MYSQL FAIL_UNDER=$FAIL_UNDER check.coverage
    - name: RST tests
      run: make VENV= INSTALL= check.rstcheck
